    (function () {

<body>
  <div id="root">
    <!-- Preloader logo; hilang sendiri saat React terpasang. Warna = gradasi logo (#0040E8 → #16AAFD). -->
    <style>
      .boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 42%, #13234A 0, #0F172A 60%); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot-ring { position: relative; width: 96px; height: 96px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(22, 170, 253, .12); }
      .boot-ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(transparent 0 30%, #0040E8 70%, #16AAFD); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); animation: boot-spin 1s linear infinite; }
      .boot-ring img { position: absolute; inset: 22px; width: 52px; height: 52px; filter: drop-shadow(0 6px 16px rgba(0, 64, 232, .45)); animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-name { margin-top: 22px; font-size: 22px; font-weight: 800; letter-spacing: .01em; color: #F8FAFC; }
      .boot-name span { background: linear-gradient(90deg, #1366FF, #16AAFD); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .boot-tag { margin-top: 4px; font-size: 10px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase; color: #94A3B8; }
      html[data-theme="light"] .boot { background: radial-gradient(circle at 50% 42%, #FFFFFF 0, #F0F4F8 60%); }
      html[data-theme="light"] .boot-name { color: #021F4A; }
      html[data-theme="light"] .boot-tag { color: #5B7B9C; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(.92); opacity: .85; } 50% { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-ring::before { animation-duration: 2.4s; } .boot-ring img { animation: none; } }
    </style>
    <div class="boot" role="status" aria-label="Memuat BohAntar">
      <div class="boot-ring"><img src="/favicon-192.png" alt="" /></div>
      <div class="boot-name">Boh<span>Antar</span></div>
      <div class="boot-tag">SuperApp Kalbar</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
