<body>
  <div id="root">
    <!-- Instant Premium Preloader (Unmounts automatically when React loads) -->
    <div
      style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #ffffff; z-index: 9999;">
      <div
        style="position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;">
        <!-- Spinning blue accent ring -->
        <div
          style="position: absolute; inset: 0; border-radius: 18px; border: 3px solid rgba(59, 130, 246, 0.1); border-top-color: #3b82f6; animation: preloader-spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;">
        </div>
        <!-- Tiny solid blue inner dot -->
        <div
          style="width: 12px; height: 12px; border-radius: 50%; bg-color: #3b82f6; background: #3b82f6; box-shadow: 0 0 10px #3b82f6;">
        </div>
      </div>
      <div style="margin-top: 24px; font-size: 18px; font-weight: 800; letter-spacing: 0.05em; color: #ffffff;">
        boh<span style="color: #3b82f6;">Antar</span>
      </div>
      <div
        style="margin-top: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.25em; color: #94a3b8; opacity: 0.8;">
        SuperApp Kalbar
      </div>
    </div>
    <style>
      @keyframes preloader-spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
